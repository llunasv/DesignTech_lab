<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <header>
            <h1> <a href="index.html"><img src="Img_assets/Logo.svg" alt="Logo" width="40" height="40"></a>DesignTech</h1>
    </header>
    <main>
        <h2>Contact Us</h2>
        <p>If you have any questions, feedback, or inquiries, please feel free to reach out to us filling out the contact information below:</p>

        <section>
            <h3>Contact Information</h3>
            <form>
                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br>

                    <label for="Age">Age:</label>
                    <input type="number" id="Age" name="Age" min="0"><br>

                    <label for="Education Degree">Education Degree:</label>
                    <select id="Education Degree" name="Education Degree">
                        <option value="High School">High School</option>
                        <option value="Bachelor's">Bachelor's</option>
                        <option value="Master's">Master's</option>
                        <option value="Professional">Professional</option>
                    </select><br>

                    <label>Interests:</label>
                    <label><input type="checkbox" name="interests" value="scientist"> Scientist</label>
                    <label><input type="checkbox" name="interests" value="investor"> Investor</label>
                    <label><input type="checkbox" name="interests" value="promoter"> Promoter</label>
                    <label><input type="checkbox" name="interests" value="official"> Government Official</label>
                </fieldset><br>

                <label>Reason for Contact:
                    <select name="reason">
                    <option>Collaboration</option>
                    <option>Complaint on property rights violation</option>
                    <option>Proposal</option>
                    <option>Error report</option>
                    </select>
                </label><br>

                <label>Details:
                    <textarea name="details" rows="5" cols="40" maxlength="300" required></textarea>
                </label><br>

                <label><input type="checkbox" name="consent" required> I agree to the processing of personal data</label><br>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>
    
</body>
</html>
